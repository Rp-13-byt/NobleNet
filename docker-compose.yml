version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: noblenet-mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_DATABASE: noblenet

  redis:
    image: redis:7.2-alpine
    container_name: noblenet-redis
    restart: unless-stopped
    ports:
      - '6379:6379'

volumes:
  mongo-data:
